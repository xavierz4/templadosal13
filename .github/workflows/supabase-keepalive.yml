# Respaldo del keep-alive de Supabase (el principal es el Worker de Cloudflare
# en workers/supabase-keepalive/). Consulta el REST cada 2 días para que el
# proyecto gratuito nunca acumule 7 días sin actividad y se pause.
#
# Nota: GitHub desactiva los crons si el repo pasa ~60 días sin actividad;
# por eso este es el respaldo y no el mecanismo principal.
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */2 * *' # cada 2 días a las 12:00 UTC
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          # La anon key es pública por diseño; RLS limita lo que puede leer.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://cfxmfiiidljtaxjahwsa.supabase.co/rest/v1/catalog_projects?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmeG1maWlpZGxqdGF4amFod3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NjQ5MDMsImV4cCI6MjA5OTI0MDkwM30.AOceQWhnw-E4HklqezgFlI9AOjC6cpj2n55hfPONofI")
          echo "Supabase respondió: $STATUS"
          test "$STATUS" = "200"
